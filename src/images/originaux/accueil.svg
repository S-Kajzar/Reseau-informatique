<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="DejaVu Sans, Arial, sans-serif">
  <!-- Illustration de l'accueil, dessinée pour le site : un réseau local (postes clients, serveur, commutateur,
       point d'accès sans fil, imprimante) relié à Internet par un routeur. Les cartes de l'accueil en sont des
       recadrages (outils/preparer-images.sh). -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F7FB"/><stop offset="1" stop-color="#DCE5F0"/></linearGradient>
    <pattern id="points" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#C9D6E6"/></pattern>
    <linearGradient id="ecran" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F8FDB"/><stop offset="1" stop-color="#1F5FA8"/></linearGradient>
    <linearGradient id="boitier" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4855"/><stop offset="1" stop-color="#1C2530"/></linearGradient>
    <linearGradient id="tour" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A4855"/><stop offset=".5" stop-color="#55636F"/><stop offset="1" stop-color="#2E3B47"/></linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B1F3A" flood-opacity=".22"/></filter>
    <!-- poste fixe : écran, pied, clavier (origine : milieu du bord haut de l'écran) -->
    <symbol id="poste" viewBox="-70 0 140 124" width="140" height="124" overflow="visible">
      <rect x="-58" y="0" width="116" height="76" rx="7" fill="#1C2530"/>
      <rect x="-51" y="7" width="102" height="58" rx="2" fill="url(#ecran)"/>
      <rect x="-43" y="15" width="44" height="6" rx="2" fill="#FFFFFF" opacity=".85"/>
      <rect x="-43" y="26" width="64" height="5" rx="2" fill="#FFFFFF" opacity=".55"/>
      <rect x="-43" y="35" width="56" height="5" rx="2" fill="#FFFFFF" opacity=".55"/>
      <rect x="-43" y="44" width="38" height="5" rx="2" fill="#FFFFFF" opacity=".55"/>
      <circle cx="0" cy="71" r="2" fill="#7D868F"/>
      <rect x="-9" y="76" width="18" height="14" fill="#46525C"/>
      <rect x="-32" y="89" width="64" height="8" rx="4" fill="#46525C"/>
      <rect x="-56" y="104" width="112" height="14" rx="3" fill="#E9ECEF" stroke="#7D868F" stroke-width="1.5"/>
      <path d="M-48 109h96M-48 113h96" stroke="#A5ADAA" stroke-width="1.2" stroke-dasharray="5 2.5"/>
    </symbol>
  </defs>

  <rect width="1120" height="620" fill="url(#fond)"/>
  <rect width="1120" height="620" fill="url(#points)"/>

  <!-- ================= liaisons ================= -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- câbles Ethernet (bleu) -->
    <g stroke="#1F5FA8" stroke-width="5">
      <path d="M470 372 V420 H186 V468"/>
      <path d="M520 372 V468"/>
      <path d="M620 372 V420 H812 V468"/>
      <path d="M440 352 H312 V226"/>
      <path d="M580 330 V252"/>
      <path d="M700 352 H884"/>
      <path d="M670 372 V404 H1004 V452"/>
    </g>
    <!-- liaison vers Internet (orange) -->
    <path d="M960 300 V206" stroke="#B26A00" stroke-width="6" stroke-dasharray="12 8"/>
    <!-- ondes Wi-Fi -->
    <g stroke="#1B7A43" stroke-width="5">
      <path d="M268 176 a52 52 0 0 0 0 52" opacity=".55"/>
      <path d="M248 160 a78 78 0 0 0 0 84" opacity=".35"/>
      <path d="M356 176 a52 52 0 0 1 0 52" opacity=".55"/>
      <path d="M376 160 a78 78 0 0 1 0 84" opacity=".35"/>
    </g>
  </g>

  <!-- paquets de données qui circulent -->
  <g stroke="#1C2530" stroke-width="2">
    <rect x="300" y="404" width="30" height="20" rx="4" fill="#F2B705"/>
    <rect x="508" y="410" width="24" height="30" rx="4" fill="#F2B705"/>
    <rect x="782" y="342" width="30" height="20" rx="4" fill="#F2B705"/>
    <rect x="568" y="276" width="24" height="30" rx="4" fill="#F2B705"/>
    <rect x="946" y="232" width="28" height="22" rx="4" fill="#FFFFFF"/>
  </g>
  <g fill="#1C2530"><path d="M338 414 l-8 -6 v12z"/><path d="M520 448 l-6 -8 h12z"/><path d="M774 352 l8 -6 v12z"/><path d="M580 268 l-6 8 h12z"/></g>

  <!-- ================= Internet ================= -->
  <g filter="url(#ombre)">
    <path d="M850 196 c-40 0 -52 -54 -12 -66 c-6 -44 52 -64 76 -32 c18 -46 96 -46 112 2 c40 -10 70 30 50 60 c34 8 26 56 -10 56 z" fill="#FFFFFF" stroke="#9DB6D6" stroke-width="3"/>
  </g>
  <text x="962" y="168" text-anchor="middle" font-size="30" font-weight="700" fill="#1F5FA8">Internet</text>

  <!-- ================= routeur ================= -->
  <g filter="url(#ombre)">
    <path d="M908 302 l-10 -42" stroke="#1C2530" stroke-width="6" stroke-linecap="round"/>
    <path d="M1012 302 l10 -42" stroke="#1C2530" stroke-width="6" stroke-linecap="round"/>
    <circle cx="897" cy="256" r="6" fill="#1C2530"/><circle cx="1023" cy="256" r="6" fill="#1C2530"/>
    <rect x="884" y="298" width="152" height="58" rx="10" fill="url(#boitier)"/>
    <rect x="896" y="336" width="128" height="6" rx="3" fill="#0E1114"/>
    <g fill="#5BD08A"><circle cx="904" cy="314" r="4.5"/><circle cx="920" cy="314" r="4.5"/><circle cx="936" cy="314" r="4.5"/></g>
    <circle cx="952" cy="314" r="4.5" fill="#F2B705"/>
    <path d="M992 309v16M1002 309v16M1012 309v16M1022 309v16" stroke="#46525C" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ================= commutateur ================= -->
  <g filter="url(#ombre)">
    <rect x="430" y="330" width="280" height="44" rx="6" fill="url(#boitier)"/>
    <g fill="#0E1114" stroke="#7D868F" stroke-width="1.2">
      <rect x="452" y="350" width="22" height="16" rx="2"/><rect x="480" y="350" width="22" height="16" rx="2"/>
      <rect x="508" y="350" width="22" height="16" rx="2"/><rect x="536" y="350" width="22" height="16" rx="2"/>
      <rect x="582" y="350" width="22" height="16" rx="2"/><rect x="610" y="350" width="22" height="16" rx="2"/>
      <rect x="638" y="350" width="22" height="16" rx="2"/><rect x="666" y="350" width="22" height="16" rx="2"/>
    </g>
    <g fill="#5BD08A"><circle cx="463" cy="342" r="3"/><circle cx="491" cy="342" r="3"/><circle cx="519" cy="342" r="3"/><circle cx="593" cy="342" r="3"/><circle cx="621" cy="342" r="3"/><circle cx="677" cy="342" r="3"/></g>
    <g fill="#F2B705"><circle cx="547" cy="342" r="3"/><circle cx="649" cy="342" r="3"/></g>
  </g>

  <!-- ================= serveur ================= -->
  <g filter="url(#ombre)">
    <rect x="530" y="84" width="100" height="168" rx="9" fill="url(#tour)"/>
    <g fill="#1C2530"><rect x="542" y="98" width="76" height="22" rx="3"/><rect x="542" y="128" width="76" height="22" rx="3"/><rect x="542" y="158" width="76" height="22" rx="3"/></g>
    <g fill="#5BD08A"><circle cx="606" cy="109" r="3.5"/><circle cx="606" cy="139" r="3.5"/></g>
    <circle cx="606" cy="169" r="3.5" fill="#F2B705"/>
    <g stroke="#7D868F" stroke-width="2"><path d="M550 109h36M550 139h36M550 169h36"/></g>
    <path d="M546 196h68M546 206h68M546 216h68" stroke="#2E3B47" stroke-width="3"/>
    <circle cx="580" cy="236" r="6" fill="none" stroke="#9DB6D6" stroke-width="2.5"/>
  </g>

  <!-- ================= point d'accès sans fil ================= -->
  <g filter="url(#ombre)">
    <ellipse cx="312" cy="206" rx="54" ry="22" fill="#FFFFFF" stroke="#7D868F" stroke-width="2.5"/>
    <ellipse cx="312" cy="200" rx="40" ry="12" fill="#E9ECEF"/>
    <circle cx="312" cy="200" r="5" fill="#1B7A43"/>
  </g>

  <!-- ================= appareils sans fil ================= -->
  <g filter="url(#ombre)">
    <!-- ordinateur portable -->
    <rect x="70" y="168" width="108" height="68" rx="6" fill="#1C2530"/>
    <rect x="77" y="175" width="94" height="54" rx="2" fill="url(#ecran)"/>
    <rect x="85" y="184" width="40" height="6" rx="2" fill="#FFFFFF" opacity=".85"/>
    <rect x="85" y="195" width="60" height="5" rx="2" fill="#FFFFFF" opacity=".55"/>
    <rect x="85" y="204" width="48" height="5" rx="2" fill="#FFFFFF" opacity=".55"/>
    <path d="M58 236 H190 l10 14 H48 z" fill="#A5ADAA" stroke="#7D868F" stroke-width="1.5"/>
    <!-- téléphone -->
    <rect x="438" y="168" width="40" height="70" rx="8" fill="#1C2530"/>
    <rect x="442" y="176" width="32" height="52" rx="2" fill="url(#ecran)"/>
    <circle cx="458" cy="233" r="2.5" fill="#7D868F"/>
  </g>

  <!-- ================= postes clients ================= -->
  <g filter="url(#ombre)">
    <use href="#poste" x="116" y="468"/>
    <use href="#poste" x="450" y="468"/>
    <use href="#poste" x="742" y="468"/>
  </g>

  <!-- ================= imprimante ================= -->
  <g filter="url(#ombre)">
    <rect x="964" y="452" width="80" height="26" fill="#FFFFFF" stroke="#7D868F" stroke-width="2"/>
    <rect x="944" y="474" width="120" height="58" rx="8" fill="#D3D8D5" stroke="#46525C" stroke-width="2.5"/>
    <rect x="958" y="514" width="92" height="8" rx="3" fill="#46525C"/>
    <rect x="968" y="520" width="72" height="34" fill="#FFFFFF" stroke="#7D868F" stroke-width="2"/>
    <path d="M978 532h52M978 541h38" stroke="#A5ADAA" stroke-width="2.5"/>
    <circle cx="1046" cy="490" r="4" fill="#5BD08A"/>
  </g>

  <!-- ================= étiquettes ================= -->
  <g font-size="19" font-weight="700" fill="#1C2530">
    <rect x="884" y="364" width="152" height="30" fill="#F2B705"/><text x="960" y="386" text-anchor="middle">Routeur</text>
    <rect x="392" y="290" width="160" height="30" fill="#F2B705"/><text x="472" y="312" text-anchor="middle">Commutateur</text>
    <rect x="644" y="84" width="104" height="30" fill="#F2B705"/><text x="696" y="106" text-anchor="middle">Serveur</text>
    <rect x="232" y="104" width="160" height="30" fill="#F2B705"/><text x="312" y="126" text-anchor="middle">Point d'accès</text>
    <rect x="934" y="566" width="140" height="30" fill="#F2B705"/><text x="1004" y="588" text-anchor="middle">Imprimante</text>
  </g>
  <g font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" font-weight="700" fill="#1F5FA8" text-anchor="middle">
    <text x="186" y="612">192.168.1.11</text>
    <text x="520" y="612">192.168.1.12</text>
    <text x="812" y="612">192.168.1.13</text>
  </g>
</svg>
